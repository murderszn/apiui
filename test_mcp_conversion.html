<!DOCTYPE html>
<html>
<head>
    <title>Test MCP API Conversion</title>
</head>
<body>
    <h1>Testing MCP API Conversion</h1>
    <div id="result"></div>

    <script>
        // Simulate the API data from /v1/apis
        const mockV1Data = {
            "apis": [
                {
                    "api_key": "d7ae4f3d-20bd-4e12-84e2-fdef325218e1",
                    "created_at": "2025-09-19T20:43:17.018065",
                    "custom_name": null,
                    "endpoints": [
                        {
                            "description": "Get data with optional filtering",
                            "method": "GET",
                            "path": "/data"
                        }
                    ],
                    "has_data_csv": true,
                    "has_main_py": false,
                    "has_requirements": false,
                    "id": "425064dc-96bc-47b4-9b4e-12e442e71f44",
                    "models": ["DataModel"],
                    "path": "cloud-run://425064dc-96bc-47b4-9b4e-12e442e71f44",
                    "port": null,
                    "started_at": "2025-09-19T20:43:17.018065",
                    "status": "running",
                    "summary": null,
                    "title": "Cloud Run API 425064dc...",
                    "url": "https://apiui-backend-44565368406.us-central1.run.app/api/425064dc-96bc-47b4-9b4e-12e442e71f44"
                }
            ],
            "total": 65
        };

        // Test the conversion logic
        const v1Data = mockV1Data;
        console.log('v1 API data received:', v1Data);

        // Convert v1 format to MCP format
        const availableAPIs = v1Data.apis.map(api => ({
            id: api.id,
            name: api.custom_name || api.title || `API ${api.id.slice(-8)}`,
            description: api.summary || api.title || `API for ${api.id}`,
            endpoint_url: api.url,
            schema: { columns: [] }, // We'll fetch this separately if needed
            sample_data: [], // v1 doesn't provide sample data in list
            created_at: api.created_at || api.started_at,
            status: api.status || 'ready'
        }));

        console.log('Converted APIs:', availableAPIs);

        // Display results
        document.getElementById('result').innerHTML = `
            <h2>Conversion Test Results</h2>
            <p>Original v1 API:</p>
            <pre>${JSON.stringify(v1Data.apis[0], null, 2)}</pre>

            <p>Converted to MCP format:</p>
            <pre>${JSON.stringify(availableAPIs[0], null, 2)}</pre>

            <p>API Name: ${availableAPIs[0].name}</p>
            <p>API Description: ${availableAPIs[0].description}</p>
            <p>API URL: ${availableAPIs[0].endpoint_url}</p>
        `;
    </script>
</body>
</html>
