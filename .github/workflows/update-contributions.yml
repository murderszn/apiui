name: Update GitHub Contributions

on:
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allow manual triggering from GitHub UI

jobs:
  update-contributions:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Fetch GitHub contributions
      run: node fetch-github-contributions.js murderszn
      env:
        GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

    - name: Update resume with new data
      run: node update-resume.js

    - name: Commit changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add frontend/resume.html
        git add frontend/github-contributions-data.js

        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "🤖 Update GitHub contributions data [automated]"
          git push
        fi
