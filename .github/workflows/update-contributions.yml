name: Update GitHub Contributions

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggering from GitHub UI

jobs:
  update-contributions:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        cd backend
        pip install -r requirements.txt

    - name: Update GitHub contributions
      run: |
        cd backend
        python -c "
        import os
        import json
        import httpx
        from datetime import datetime

        # Get GitHub token
        github_token = os.environ.get('GITHUB_TOKEN') or os.environ.get('PERSONAL_ACCESS_TOKEN')
        if not github_token:
            print('❌ GitHub token not configured')
            exit(1)

        # GitHub GraphQL query
        query = '''
        query {
            user(login: \"murderszn\") {
                contributionsCollection {
                    contributionCalendar {
                        totalContributions
                        weeks {
                            contributionDays {
                                contributionCount
                                date
                            }
                        }
                    }
                }
            }
        }'''

        # Make GraphQL request
        response = httpx.post(
            'https://api.github.com/graphql',
            headers={
                'Authorization': f'Bearer {github_token}',
                'Content-Type': 'application/json'
            },
            json={'query': query}
        )

        if response.status_code != 200:
            print(f'❌ GitHub API error: {response.status_code}')
            exit(1)

        data = response.json()
        if 'errors' in data:
            print(f'❌ GraphQL errors: {data[\"errors\"]}')
            exit(1)

        # Extract contributions data
        weeks = data['data']['user']['contributionsCollection']['contributionCalendar']['weeks']
        contributions = []
        for week in weeks:
            for day in week['contributionDays']:
                contributions.append({
                    'date': day['date'],
                    'count': day['contributionCount']
                })

        total_contributions = sum(c['count'] for c in contributions)

        # Create JavaScript data file
        js_content = f'// Static GitHub contributions data (fetched {datetime.utcnow().strftime(\"%Y-%m-%d\")})\\n'
        js_content += 'function getStaticContributions() {\\n'
        js_content += f'    return {json.dumps(contributions, indent=12)};\\n'
        js_content += '}\\n'

        # Write to frontend data file
        frontend_dir = os.path.join('..', 'frontend')
        os.makedirs(frontend_dir, exist_ok=True)
        data_file = os.path.join(frontend_dir, 'github-contributions-data.js')
        with open(data_file, 'w') as f:
            f.write(js_content)

        # Update resume.html
        resume_file = os.path.join(frontend_dir, 'resume.html')
        with open(resume_file, 'r') as f:
            resume_content = f.read()

        # Find and replace the getStaticContributions function
        import re
        pattern = r'function getStaticContributions\\(\\) \\{\\s*return \\[[\s\S]*?\\];\\s*\\}'
        new_function = f'function getStaticContributions() {{\\n            return {json.dumps(contributions, indent=12)};\\n        }}'

        if re.search(pattern, resume_content):
            resume_content = re.sub(pattern, new_function, resume_content)
            with open(resume_file, 'w') as f:
                f.write(resume_content)

        print(f'✅ Updated GitHub contributions: {total_contributions} total contributions')
        print(f'📊 {len(contributions)} days processed')
        "
      env:
        GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

    - name: Commit changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add frontend/resume.html
        git add frontend/github-contributions-data.js

        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "🤖 Update GitHub contributions data [automated]"
          git push
        fi
