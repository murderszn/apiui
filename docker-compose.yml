version: '3.8'

services:
  apiui-backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - API_GATEWAY_URL=${API_GATEWAY_URL:-http://localhost:8000}
    volumes:
      - ./backend:/app/backend
      - ./uploads:/app/uploads
      - ./generated_apis:/app/generated_apis
    networks:
      - apiui-network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "8080:8080"
    environment:
      - FRONTEND_PORT=8080
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - apiui-backend
    networks:
      - apiui-network

networks:
  apiui-network:
    driver: bridge
