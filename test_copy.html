<!DOCTYPE html>
<html>
<head>
    <title>Test Copy Button</title>
</head>
<body>
    <h1>Test Copy Functionality</h1>
    <button class="copy-btn" data-code="test text">Copy Test Text</button>
    <div id="result"></div>

    <script>
        document.addEventListener('click', async (e) => {
            if (e.target.closest('.copy-btn')) {
                e.preventDefault();
                const button = e.target.closest('.copy-btn');
                const code = button.getAttribute('data-code');

                console.log('Copy button clicked, code:', code);

                try {
                    // Try modern clipboard API first
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        await navigator.clipboard.writeText(code);
                    } else {
                        // Fallback for older browsers or HTTP
                        const textArea = document.createElement('textarea');
                        textArea.value = code;
                        document.body.appendChild(textArea);
                        textArea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textArea);
                    }

                    document.getElementById('result').textContent = '✅ Copied successfully: ' + code;
                    console.log('Successfully copied to clipboard:', code);
                } catch (error) {
                    console.error('Failed to copy to clipboard:', error);
                    document.getElementById('result').textContent = '❌ Failed to copy: ' + error.message;
                }
            }
        });
    </script>
</body>
</html>
