<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connection Test</title>
</head>
<body>
    <h1>Connection Test</h1>
    <div id="result"></div>
    <div id="error"></div>

    <script>
        async function testConnection() {
            const resultDiv = document.getElementById('result');
            const errorDiv = document.getElementById('error');

            try {
                const params = new URLSearchParams(window.location.search);
                const backendBase = params.get('backend') || 'https://your-cloud-run-service.run.app';
                const normalizedBase = backendBase.replace(/\/+$/, '');
                const targetUrl = `${normalizedBase}/v1/apis`;

                resultDiv.innerHTML = `Testing connection to backend at <code>${targetUrl}</code>...`;

                const response = await fetch(targetUrl, {
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                const data = await response.json();

                resultDiv.innerHTML = `
                    <h2>✅ Connection Successful!</h2>
                    <p>Response: ${JSON.stringify(data, null, 2)}</p>
                `;
            } catch (error) {
                errorDiv.innerHTML = `
                    <h2>❌ Connection Failed</h2>
                    <p>Error: ${error.message}</p>
                `;
                console.error('Connection test failed:', error);
            }
        }

        // Run test when page loads
        testConnection();
    </script>
</body>
</html>
