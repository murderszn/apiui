        .toolbar-btn:active {

        }

        .toolbar-btn.primary {
            background: #000000;
            color: white;
            border-color: #000000;
        }

        .toolbar-btn.primary:hover {
            background: #333333;
            border-color: #333333;
        }

        .toolbar-btn:disabled {
            background: #f3f4f6;
            color: #9ca3af;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .formula-bar {

            padding: 8px 20px;

        }

        /* Status Bar */
        .status-bar {
            background: #ffffff;

            color: #6b7280;

        .context-menu-item:hover {

        .context-menu-separator {

            background: #f1f5f9;

            background: #cbd5e1;

        .scroll-container {

        .pagination-controls {

            cursor: pointer;
            font-size: 14px;

        }

        .pagination-btn:hover:not(:disabled) {

        }

        .pagination-btn:disabled {
            background-color: #f9fafb;
            color: #9ca3af;
            cursor: not-allowed;
        }

        .page-info {
            font-size: 14px;
            color: #6b7280;
        }
    </style>
</head>

        document.addEventListener('DOMContentLoaded', function() {
            if (!apiData) {
                showError('No API data provided');
                return;

            try {
                api = JSON.parse(decodeURIComponent(apiData));

            setupEventListeners();

                mobileRefreshBtn.addEventListener('click', loadData);
            }
            if (mobileSaveBtn) {
                mobileSaveBtn.addEventListener('click', saveChanges);
            }

            // Context menu
            document.addEventListener('contextmenu', handleContextMenu);
            document.addEventListener('click', hideContextMenu);
        }

        async function loadData() {
            if (!api) return;

            try {
                showStatus('Loading data...', 'info');
                const baseUrl = api.api_url || api.url;

                if (!baseUrl) {
                    throw new Error('No API URL available');
                }

                // Fetch all data (remove limit to get everything)
                const response = await fetch(`${baseUrl}/data`);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const apiResponse = await response.json();
                const data = Array.isArray(apiResponse) ? apiResponse : (apiResponse.data || []);

                originalData = JSON.parse(JSON.stringify(data)); // Deep copy
                modifiedData = JSON.parse(JSON.stringify(data)); // Deep copy
                totalRows = data.length;

                if (data.length > 0) {
                    columns = Object.keys(data[0]);
                    renderTable();
                    updatePagination();
                } else {
                    showEmptyState();
                }

                // Reset deleted indices and pagination when data is reloaded
                deletedIndices = new Set();
                currentPage = 1;
                updateModifiedCount();
                updatePagination();
                hideStatus();

            } catch (error) {
                console.error('Error loading data:', error);
                showError('Failed to load data: ' + error.message);
            }
        }

        function renderTable() {
            // Clear existing content
            columnHeaders.innerHTML = '<tr></tr>';
            tableBody.innerHTML = '';

            if (columns.length === 0) {
                showEmptyState();
                return;
            }

            // Render column headers
            const headerRow = columnHeaders.querySelector('tr');
            headerRow.innerHTML = '<th class="row-headers"></th>'; // Empty corner cell

            columns.forEach((column, index) => {
                const columnLetter = String.fromCharCode(65 + index); // A, B, C, etc.
                headerRow.innerHTML += `<th onclick="selectColumn('${column}')">${column}</th>`;
            });

            // Render body for current page, skipping deleted rows
            const startIndex = (currentPage - 1) * pageSize;
            let renderedCount = 0;
            let actualIndex = 0;

            while (renderedCount < pageSize && actualIndex < modifiedData.length) {
                if (!deletedIndices.has(actualIndex)) {
                    const row = modifiedData[actualIndex];
                    const displayIndex = startIndex + renderedCount;

                    const rowElement = document.createElement('tr');
                    rowElement.setAttribute('data-row-index', actualIndex);

                    // Row header with number
                    const rowHeader = document.createElement('th');
                    rowHeader.className = 'row-headers';
                    rowHeader.textContent = displayIndex + 1;
                    rowHeader.onclick = () => selectRow(actualIndex);
                    rowElement.appendChild(rowHeader);

                    // Data cells
                    columns.forEach((column, colIndex) => {
                        const cellElement = document.createElement('td');
                        cellElement.className = 'data-cell';

                        const value = row[column];
                        const inputType = getInputType(value);
                        const cellRef = `${String.fromCharCode(65 + colIndex)}${displayIndex + 1}`;

                        const inputElement = document.createElement(inputType);
                        inputElement.value = value || '';
                        inputElement.onfocus = () => selectCell(cellElement, cellRef, actualIndex, column);
                        inputElement.oninput = (e) => {
                            updateCell(actualIndex, column, e.target.value);
                            updateFormulaBar(e.target.value);
                        };
                        inputElement.onblur = () => deselectCell(cellElement);

                        if (inputType === 'textarea') {
                            inputElement.textContent = value || '';
                        }

                        // Add cell type class
                        if (cellElement && cellElement.classList) {
                            if (inputType === 'input' && typeof value === 'number') {
                                cellElement.classList.add('cell-number');
                            } else if (typeof value === 'boolean') {
                                cellElement.classList.add('cell-boolean');
                            } else {
                                cellElement.classList.add('cell-text');
                            }
                        }

                        cellElement.appendChild(inputElement);

                        // Add row actions on hover
                        if (colIndex === columns.length - 1 && cellElement) {
                            const actionsDiv = document.createElement('div');
                            actionsDiv.className = 'row-actions';
                            actionsDiv.innerHTML = `
                                <button class="row-action-btn delete" onclick="deleteRow(${actualIndex})">
                                    ×
                                </button>
                            `;
                            cellElement.appendChild(actionsDiv);
                        }

                        rowElement.appendChild(cellElement);
                    });

                    tableBody.appendChild(rowElement);
                    renderedCount++;
                }
                actualIndex++;
            }

            totalRows = modifiedData.length - deletedIndices.size;
            if (totalRowsSpan) totalRowsSpan.textContent = totalRows;
            if (statusInfo) statusInfo.textContent = `Ready - ${totalRows} rows loaded`;
            updatePagination();
        }

        function getInputType(value) {
            if (typeof value === 'boolean') return 'select';
            if (typeof value === 'number') return 'input';
            if (value && value.length > 50) return 'textarea';
            return 'input';
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return (text || '').replace(/[&<>"']/g, m => map[m]);
        }

        function updateCell(rowIndex, column, value) {
            // Convert value to appropriate type
            let processedValue = value;
            const originalValue = originalData[rowIndex]?.[column];

            if (typeof originalValue === 'number') {
                processedValue = parseFloat(value) || 0;
            } else if (typeof originalValue === 'boolean') {
                processedValue = value === 'true';
            }

            modifiedData[rowIndex][column] = processedValue;
            updateModifiedCount();
        }

        function deleteRow(rowIndex) {
            if (confirm('Are you sure you want to delete this row?')) {
                deletedIndices.add(rowIndex);
                renderTable();
                updateModifiedCount();
            }
        }

        function addNewRow() {
            // Create a new row with default values based on the first row structure
            const newRow = {};
            columns.forEach(column => {
                const firstValue = originalData[0]?.[column];
                if (typeof firstValue === 'number') {
                    newRow[column] = 0;
                } else if (typeof firstValue === 'boolean') {
                    newRow[column] = false;
                } else {
                    newRow[column] = '';
                }
            });

            modifiedData.push(newRow);
            renderTable();
            updateModifiedCount();
        }

        function changePageSize() {
            pageSize = parseInt(pageSizeSelect.value);
            currentPage = 1;
            renderTable();
            updatePagination();
        }

        function changePage(direction) {
            const totalPages = Math.ceil(totalRows / pageSize);
            const newPage = currentPage + direction;

            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                renderTable();
                updatePagination();
            }
        }

        function updatePagination() {
            const totalPages = Math.ceil(totalRows / pageSize);

            if (totalPages <= 1) {
                if (paginationContainer && paginationContainer.classList) {
                    paginationContainer.classList.add('hidden');
                }
                return;
            }

            if (paginationContainer && paginationContainer.classList) {
                paginationContainer.classList.remove('hidden');
            }
            if (pageInfo) pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;

            if (prevPageBtn) prevPageBtn.disabled = currentPage === 1;
            if (nextPageBtn) nextPageBtn.disabled = currentPage === totalPages;
        }

        function selectCell(cellElement, cellRef, rowIndex, column) {
            // Deselect previous cell
            if (currentCell && currentCell.classList) {
                currentCell.classList.remove('selected');
            }

            // Select new cell
            currentCell = cellElement;
            if (currentCell && currentCell.classList) {
                currentCell.classList.add('selected');
                currentCellRef = cellRef;
            }

            // Update formula bar
            if (currentCellDisplay) currentCellDisplay.textContent = cellRef;
            const input = cellElement && cellElement.querySelector ? cellElement.querySelector('input, textarea, select') : null;
            if (input && formulaInput) {
                formulaInput.value = input.value;
                formulaInput.focus();
            }

            if (selectionInfo) selectionInfo.textContent = `Selected: ${cellRef}`;
        }

        function deselectCell(cellElement) {
            if (cellElement && cellElement.classList) {
                cellElement.classList.remove('selected');
            }
            currentCell = null;
            if (currentCellDisplay) currentCellDisplay.textContent = 'A1';
            if (formulaInput) formulaInput.value = '';
            if (selectionInfo) selectionInfo.textContent = '';
        }

        function selectRow(rowIndex) {
            // Implement row selection
            if (statusInfo) statusInfo.textContent = `Row ${rowIndex + 1} selected`;
        }

        function selectColumn(columnName) {
            // Implement column selection
            if (statusInfo) statusInfo.textContent = `Column ${columnName} selected`;
        }

        function updateFormulaBar(value) {
            if (currentCell && formulaInput) {
                formulaInput.value = value;
            }
        }

        function updateCurrentCell() {
            if (currentCell && formulaInput && formulaInput.value !== undefined) {
                const input = currentCell.querySelector ? currentCell.querySelector('input, textarea, select') : null;
                if (input) {
                    input.value = formulaInput.value;
                    const rowElement = currentCell.closest ? currentCell.closest('tr') : null;
                    if (rowElement) {
                        const rowIndex = parseInt(rowElement.getAttribute('data-row-index'));
                        const parent = currentCell.parentNode;
                        if (parent && parent.children) {
                            const columnIndex = Array.from(parent.children).indexOf(currentCell) - 1; // -1 for row header
                            if (columnIndex >= 0 && columns && columns[columnIndex]) {
                                const column = columns[columnIndex];
                                updateCell(rowIndex, column, formulaInput.value);
                            }
                        }
                    }
                }
            }
        }

        function exportToCsv() {
            if (!modifiedData || modifiedData.length === 0) {
                showStatus('No data to export', 'error');
                return;
            }

            // Create CSV content
            const headers = columns.join(',');
            const rows = modifiedData
                .filter((_, index) => !deletedIndices.has(index))
                .map(row => columns.map(col => {
                    const value = row[col];
                    // Escape quotes and wrap in quotes if contains comma, quote, or newline
                    if (typeof value === 'string' && (value.includes(',') || value.includes('"') || value.includes('\n'))) {
                        return '"' + value.replace(/"/g, '""') + '"';
                    }
                    return value || '';
                }).join(','))
                .join('\n');

            const csvContent = headers + '\n' + rows;

            // Download CSV
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', `${api.title || 'export'}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            showStatus('CSV exported successfully', 'success');
        }

        function handleContextMenu(e) {
            e.preventDefault();

            // Only show context menu on table cells
            if (!e.target.closest('.data-cell')) return;

            const cell = e.target.closest('.data-cell');
            const rect = cell.getBoundingClientRect();

            contextMenu.innerHTML = `
                <div class="context-menu-item" onclick="copyCell()">Copy</div>
                <div class="context-menu-item" onclick="pasteCell()">Paste</div>
                <div class="context-menu-separator"></div>
                <div class="context-menu-item" onclick="clearCell()">Clear</div>
            `;

            contextMenu.style.left = e.pageX + 'px';
            contextMenu.style.top = e.pageY + 'px';
            contextMenu.classList.remove('hidden');
        }

        function hideContextMenu() {
            contextMenu.classList.add('hidden');
        }

        function copyCell() {
            // Implement copy functionality
            hideContextMenu();
        }

        function pasteCell() {
            // Implement paste functionality
            hideContextMenu();
        }

        function clearCell() {
            // Implement clear functionality
            hideContextMenu();
        }

        function changePageSize() {
            pageSize = parseInt(pageSizeSelect.value);
            currentPage = 1;
            renderTable();
            updatePagination();
        }

        function changePage(direction) {
            const totalPages = Math.ceil(totalRows / pageSize);
            const newPage = currentPage + direction;

            if (newPage >= 1 && newPage <= totalPages) {
                currentPage = newPage;
                renderTable();
                updatePagination();
            }
        }

        function updatePagination() {
            const totalPages = Math.ceil(totalRows / pageSize);

            if (totalPages <= 1) {
                if (paginationContainer && paginationContainer.classList) {
                    paginationContainer.classList.add('hidden');
                }
                return;
            }

            if (paginationContainer && paginationContainer.classList) {
                paginationContainer.classList.remove('hidden');
            }
            if (pageInfo) pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;

            if (prevPageBtn) prevPageBtn.disabled = currentPage === 1;
            if (nextPageBtn) nextPageBtn.disabled = currentPage === totalPages;
        }

        function updateModifiedCount() {
            let modifiedCount = 0;

            // Count modified rows (excluding deleted ones)
            modifiedData.forEach((row, index) => {
                if (!deletedIndices.has(index) && (!originalData[index] || JSON.stringify(row) !== JSON.stringify(originalData[index]))) {
                    modifiedCount++;
                }
            });

            // Count added rows
            for (let i = originalData.length; i < modifiedData.length; i++) {
                if (!deletedIndices.has(i)) {
                    modifiedCount++;
                }
            }

            // Count deleted rows
            modifiedCount += deletedIndices.size;

            if (modifiedRowsSpan) modifiedRowsSpan.textContent = modifiedCount;
            if (saveBtn) saveBtn.disabled = modifiedCount === 0;
            if (mobileSaveBtn) mobileSaveBtn.disabled = modifiedCount === 0;
        }

        async function saveChanges() {
            if (!api) return;

            try {
                if (saveBtn) saveBtn.disabled = true;
                if (mobileSaveBtn) mobileSaveBtn.disabled = true;
                if (saveText) saveText.innerHTML = '<div class="loading-spinner mr-2 inline-block"></div> Saving...';
                if (mobileSaveText) mobileSaveText.innerHTML = '<div class="loading-spinner mr-2 inline-block"></div> Saving...';

                const baseUrl = api.api_url || api.url;
                if (!baseUrl) {
                    throw new Error('No API URL available');
                }

                // Calculate what changes need to be made
                const changes = calculateChanges();

                  if (changes.length === 0) {
                      showStatus('No changes to save.', 'info');
                      if (saveText) saveText.textContent = 'Save Changes';
                      if (mobileSaveText) mobileSaveText.textContent = 'Save Changes';
                      if (saveBtn) saveBtn.disabled = true;
                      if (mobileSaveBtn) mobileSaveBtn.disabled = true;
                      return;
                  }

                // Process changes
                let successCount = 0;
                let errorCount = 0;

                for (const change of changes) {
                    try {
                        await processChange(baseUrl, change);
                        successCount++;
                    } catch (error) {
                        console.error('Error processing change:', change, error);
                        errorCount++;
                    }
                }

                // Reload data to reflect changes
                await loadData();

                if (errorCount === 0) {
                    showStatus(`Successfully saved ${successCount} change(s).`, 'success');
                } else {
                    showStatus(`Saved ${successCount} change(s), but ${errorCount} failed.`, 'error');
                }

                if (saveText) saveText.textContent = 'Save Changes';
                if (mobileSaveText) mobileSaveText.textContent = 'Save Changes';
                if (saveBtn) saveBtn.disabled = true;
                if (mobileSaveBtn) mobileSaveBtn.disabled = true;

            } catch (error) {
                console.error('Error saving changes:', error);
                showError('Failed to save changes: ' + error.message);
                if (saveText) saveText.textContent = 'Save Changes';
                if (mobileSaveText) mobileSaveText.textContent = 'Save Changes';
                if (saveBtn) saveBtn.disabled = false;
                if (mobileSaveBtn) mobileSaveBtn.disabled = false;
            }
        }

        function calculateChanges() {
            const changes = [];

            // Check for modified rows (skip deleted ones)
            modifiedData.forEach((row, index) => {
                if (!deletedIndices.has(index) && (!originalData[index] || JSON.stringify(row) !== JSON.stringify(originalData[index]))) {
                    changes.push({
                        type: 'update',
                        index: index,
                        data: row
                    });
                }
            });

            // Check for added rows (rows beyond original length)
            for (let i = originalData.length; i < modifiedData.length; i++) {
                if (!deletedIndices.has(i)) {
                    changes.push({
                        type: 'create',
                        data: modifiedData[i]
                    });
                }
            }

            // Check for deleted rows
            deletedIndices.forEach(index => {
                if (index < originalData.length) {
                    changes.push({
                        type: 'delete',
                        index: index
                    });
                }
            });

            return changes;
        }

        async function processChange(baseUrl, change) {
            const normalizedUrl = baseUrl.replace(/\/$/, ''); // Remove trailing slash

            switch (change.type) {
                case 'create':
                    const createResponse = await fetch(`${normalizedUrl}/data`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(change.data)
                    });

                    if (!createResponse.ok) {
                        const errorText = await createResponse.text().catch(() => '');
                        if (createResponse.status === 0 || errorText.includes('CORS')) {
                            throw new Error(`Create failed: CORS error. This API doesn't allow cross-origin requests. Try generating a new API or redeploying this one with CORS enabled.`);
                        }
                        throw new Error(`Create failed: ${createResponse.status} ${createResponse.statusText}`);
                    }
                    break;

                case 'update':
                    const updateResponse = await fetch(`${normalizedUrl}/data/${change.index}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(change.data)
                    });

                    if (!updateResponse.ok) {
                        const errorText = await updateResponse.text().catch(() => '');
                        if (updateResponse.status === 0 || errorText.includes('CORS')) {
                            throw new Error(`Update failed: CORS error. This API doesn't allow cross-origin requests. Try generating a new API or redeploying this one with CORS enabled.`);
                        }
                        throw new Error(`Update failed: ${updateResponse.status} ${updateResponse.statusText}`);
                    }
                    break;

                case 'delete':
                    const deleteResponse = await fetch(`${normalizedUrl}/data/${change.index}`, {
                        method: 'DELETE'
                    });

                    if (!deleteResponse.ok) {
                        const errorText = await deleteResponse.text().catch(() => '');
                        if (deleteResponse.status === 0 || errorText.includes('CORS')) {
                            throw new Error(`Delete failed: CORS error. This API doesn't allow cross-origin requests. Try generating a new API or redeploying this one with CORS enabled.`);
                        }
                        throw new Error(`Delete failed: ${deleteResponse.status} ${deleteResponse.statusText}`);
                    }
                    break;

                default:
                    throw new Error(`Unknown change type: ${change.type}`);
            }
        }

        function showEmptyState() {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="${columns.length + 2}" class="text-center py-12">
                        <svg class="w-12 h-12 text-gray-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                        </svg>
                        <p class="text-gray-500 mb-2">No data available</p>
                        <button onclick="addNewRow()" class="add-row-btn">Add First Row</button>
                    </td>
                </tr>
            `;
        }

        function showStatus(message, type = 'info') {
            statusMessage.textContent = message;
            statusMessage.className = `status-message status-${type}`;
            statusContainer.classList.remove('hidden');
        }

        function hideStatus() {
            statusContainer.classList.add('hidden');
        }

        function showError(message) {
            showStatus(message, 'error');
        }

        // Global function for onclick handlers
        window.deleteRow = deleteRow;
        window.updateCell = updateCell;
        window.addNewRow = addNewRow;
    </script>
