<!DOCTYPE html>
<html>
<head>
    <title>Test API Detail Page</title>
</head>
<body>
    <h1>API Detail Page Test</h1>
    <p>Click the button below to test the API detail page with proper data loading:</p>

    <button onclick="testApiDetail()">Test API Detail Page</button>

    <div id="result"></div>

    <script>
        function testApiDetail() {
            // Create test API data
            const testApiData = {
                id: "test123",
                title: "Sample User Dataset",
                api_url: "https://example.com/api/test123",
                created_at: "2025-10-03T00:00:00.000Z",
                status: "running",
                endpoints: [
                    { method: "GET", route: "/data", function: "get_all_records" },
                    { method: "POST", route: "/data", function: "create_record" }
                ]
            };

            // Encode and navigate
            const apiDataEncoded = encodeURIComponent(JSON.stringify(testApiData));
            const url = `http://localhost:8080/api-detail.html?id=${testApiData.id}&data=${apiDataEncoded}`;
            
            document.getElementById('result').innerHTML = `
                <h2>Test URL:</h2>
                <a href="${url}" target="_blank">${url}</a>
                <br><br>
                <h2>Expected Result:</h2>
                <ul>
                    <li>Page should load with pixelated design</li>
                    <li>Title should show "Sample User Dataset"</li>
                    <li>Stats should show: 5 Records, 5 Columns, ~2 KB</li>
                    <li>Data preview should show mock user data</li>
                    <li>API endpoints should be displayed</li>
                    <li>No infinite loading spinner</li>
                </ul>
                <p><strong>Click the link above to test!</strong></p>
            `;
        }
    </script>
</body>
</html>
