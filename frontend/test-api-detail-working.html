<!DOCTYPE html>
<html>
<head>
    <title>Test API Detail Page Loading</title>
</head>
<body>
    <h1>Testing API Detail Page Data Loading</h1>
    <p>This page tests if the API detail page can load and display mock data when the real API is not accessible.</p>

    <div id="test-result">Testing...</div>

    <script>
        // Simulate the API data that would be passed from the app
        const testApiData = {
            id: "cb895f91-d355-49e1-a6ef-546c14f08fd1",
            title: "Sample Data CSV",
            api_url: "https://apiui-cb895f91-us-central1.run.app/api/cb895f91-d355-49e1-a6ef-546c14f08fd1",
            created_at: "2025-10-03T00:00:00.000Z",
            status: "running",
            endpoints: [
                { method: "GET", route: "/data", function: "get_all_records" },
                { method: "POST", route: "/data", function: "create_record" }
            ]
        };

        // Encode the data like the app would
        const apiDataEncoded = encodeURIComponent(JSON.stringify(testApiData));

        // Create the URL that would be used when clicking an API card
        const testUrl = `http://localhost:8080/api-detail.html?id=${testApiData.id}&data=${apiDataEncoded}`;

        document.getElementById('test-result').innerHTML = `
            <h2>Test URL Generated:</h2>
            <a href="${testUrl}" target="_blank">${testUrl}</a>
            <br><br>
            <h2>Decoded API Data:</h2>
            <pre>${JSON.stringify(testApiData, null, 2)}</pre>
            <br>
            <p><strong>Click the link above to test the API detail page.</strong></p>
            <p>The page should load, show the pixelated design, and display mock data since the Cloud Run API returns 404.</p>
        `;
    </script>
</body>
</html>
